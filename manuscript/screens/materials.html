<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Materials — Manuscript</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="../shared/shared-components.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

function MaterialsScreen() {
  const initial = (typeof location !== 'undefined' && location.hash) ? location.hash.slice(1) : 'analysis';
  const [selected, setSelected] = useState(initial);

  return (
    <>
      <ScreenBar current="materials" label="Materials" />
      <ConceptNote>Materials are versioned. Pre-registration is a commit, not a PDF.</ConceptNote>

      <ScreenIntro
        kicker="Screen 04 · Materials"
        title={<>Pre-registration, <em style={{ fontStyle: 'italic' }}>as a commit.</em></>}
        caption="The survey instrument, interview protocol, consent form, stimuli, and analysis plan — all versioned. Every change is a diff. The pre-reg freeze is just a tag. OSF + IRB see the same file."
      />

      <MockFrame title="claude-ra · materials" height={680}>
        <ProjectRail active="materials" />
        <MaterialsBody selected={selected} setSelected={setSelected} />
      </MockFrame>

      <div className="container" style={{ padding: '32px 24px 0' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 24, borderTop: `1px solid ${RA.line}`, paddingTop: 24 }}>
          <FN num="A"><b>Everything is versioned.</b> Survey v1.3 → v1.4: reviewer sees the diff, not a new PDF.</FN>
          <FN num="B"><b>Pre-reg is a tag.</b> At submission, you tag a commit <code style={mono}>prereg-2025-03-01</code>. OSF reads the tag.</FN>
          <FN num="C"><b>IRB sees source.</b> Approved consent form lives here, next to the protocol that references it.</FN>
        </div>
      </div>

      <ScreenFooter prev="figures" next="papers" />
    </>
  );
}

const mono = { fontFamily: RA.mono, fontSize: 11.5, background: RA.paper2, padding: '1px 4px' };

function FN({ num, children }) {
  return (
    <div style={{ display: 'flex', gap: 14 }}>
      <span style={{ width: 26, height: 26, borderRadius: '50%', background: RA.paper2, border: `1px solid ${RA.line}`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontFamily: RA.serif, fontSize: 15, color: RA.accent, flexShrink: 0 }}>{num}</span>
      <div style={{ fontSize: 14, color: RA.ink2, lineHeight: 1.55 }}>{children}</div>
    </div>
  );
}

function MaterialsBody({ selected, setSelected }) {
  const items = [
    { id: 'survey',    name: 'survey_instrument.qsf',   kind: 'Qualtrics', v: 'v1.4', status: 'locked', note: 'pre-registered' },
    { id: 'interview', name: 'interview_protocol.md',   kind: 'protocol',  v: 'v2.1', status: 'draft',  note: '12 questions · semi-structured' },
    { id: 'consent',   name: 'consent_irb.pdf',         kind: 'IRB',       v: 'approved', status: 'locked', note: 'IRB #24-0451 · Mar 2025' },
    { id: 'stim',      name: 'stimuli/',                kind: 'folder',    v: '8 items', status: 'draft', note: 'task vignettes' },
    { id: 'analysis',  name: 'analysis_plan.md',        kind: 'plan',      v: 'v1.0', status: 'locked', note: 'pre-registered' },
  ];
  const sel = items.find(i => i.id === selected) || items[0];

  return (
    <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '340px 1fr', overflow: 'hidden' }}>
      <div style={{ borderRight: `1px solid ${RA.line}`, padding: '16px 0', overflow: 'auto' }}>
        <div style={{ padding: '0 20px 10px', fontFamily: RA.mono, fontSize: 10, textTransform: 'uppercase', letterSpacing: 0.1, color: RA.ink3, display: 'flex', justifyContent: 'space-between' }}>
          <span>Materials · {items.length}</span>
          <span>+ add</span>
        </div>
        {items.map(it => (
          <button key={it.id} onClick={() => setSelected(it.id)} style={{
            display: 'block', width: '100%', textAlign: 'left',
            padding: '12px 20px', border: 'none', cursor: 'pointer',
            background: selected === it.id ? RA.paper2 : 'transparent',
            borderLeft: selected === it.id ? `2px solid ${RA.accent}` : '2px solid transparent',
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 3 }}>
              <span style={{ fontFamily: RA.mono, fontSize: 12.5, color: RA.ink }}>{it.name}</span>
              <span style={{ fontFamily: RA.mono, fontSize: 10, color: it.status === 'locked' ? RA.accent : RA.ink3 }}>
                {it.status === 'locked' && '🔒 '}{it.v}
              </span>
            </div>
            <div style={{ fontSize: 11, color: RA.ink3 }}>{it.kind} · {it.note}</div>
          </button>
        ))}
      </div>

      <div style={{ padding: 28, overflow: 'auto', background: RA.paper }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 18, paddingBottom: 14, borderBottom: `1px solid ${RA.line}` }}>
          <div>
            <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3 }}>{sel.kind} · {sel.status}</div>
            <div style={{ fontFamily: RA.serif, fontSize: 22, marginTop: 3 }}>{sel.name}</div>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button style={miniBtn()}>view diff</button>
            <button style={miniBtn()}>history</button>
            <button style={miniBtn(true)}>share ↗</button>
          </div>
        </div>

        {selected === 'survey' && <SurveyPreview />}
        {selected === 'interview' && <InterviewPreview />}
        {selected === 'consent' && <ConsentPreview />}
        {selected === 'stim' && <StimuliPreview />}
        {selected === 'analysis' && <AnalysisPreview />}
      </div>
    </div>
  );
}

function SurveyPreview() {
  return (
    <div>
      <div style={{ display: 'flex', gap: 16, marginBottom: 20, padding: 12, background: RA.accentSoft, border: `1px solid ${RA.accent}`, borderRadius: 3 }}>
        <span style={{ color: RA.accent, fontSize: 18 }}>🔒</span>
        <div style={{ fontSize: 13, color: RA.accentDeep }}>
          <b>Pre-registered v1.4</b> — tagged <span style={mono}>prereg-2025-03-01</span>. Any edit after this point creates a v2 branch and appears in the deviation log.
        </div>
      </div>

      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, marginBottom: 10 }}>
        10 items · 5-point Likert · α=.87 on pilot N=40
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
        {[
          'q1. I trust AI-generated literature reviews to be accurate.',
          'q2. I verify AI outputs against primary sources.',
          'q3. I would cite a claim from an AI without checking it.',
          'q4. AI tools make my research worse.',
          'q5. I disclose AI use in my methods section.',
        ].map((q, i) => (
          <div key={i} style={{ padding: '10px 14px', border: `1px solid ${RA.line}`, borderRadius: 3, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
            <span style={{ fontSize: 13, color: RA.ink2 }}>{q}</span>
            <div style={{ display: 'flex', gap: 4 }}>
              {[1,2,3,4,5].map(n => (
                <span key={n} style={{ width: 18, height: 18, borderRadius: '50%', border: `1px solid ${RA.line}`, fontSize: 10, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: RA.ink3, fontFamily: RA.mono }}>{n}</span>
              ))}
            </div>
          </div>
        ))}
        <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, textAlign: 'center', padding: 10 }}>
          + 5 more items · click to expand
        </div>
      </div>

      <div style={{ marginTop: 20, padding: 14, background: RA.paper2, borderRadius: 3 }}>
        <div style={{ fontFamily: RA.mono, fontSize: 10, textTransform: 'uppercase', letterSpacing: 0.1, color: RA.ink3, marginBottom: 10 }}>Recent diffs</div>
        <div style={{ fontFamily: RA.mono, fontSize: 12, color: RA.ink2, lineHeight: 1.8 }}>
          <div><span style={{ color: RA.accent }}>v1.4</span> · 2025-03-01 · pre-reg freeze</div>
          <div><span style={{ color: RA.ink3 }}>v1.3</span> · rewrote q7 (double-barrel)</div>
          <div><span style={{ color: RA.ink3 }}>v1.2</span> · added attention check</div>
          <div><span style={{ color: RA.ink3 }}>v1.1</span> · pilot N=40 round</div>
          <div><span style={{ color: RA.ink3 }}>v1.0</span> · initial draft from lit review</div>
        </div>
      </div>
    </div>
  );
}

function InterviewPreview() {
  return (
    <div style={{ fontFamily: RA.serif, fontSize: 14, color: RA.ink2, lineHeight: 1.65, maxWidth: 640 }}>
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, marginBottom: 10 }}>protocol · v2.1 · semi-structured · ~45min</div>
      <h3 style={{ fontSize: 16, fontFamily: RA.serif, fontWeight: 500, marginTop: 0 }}>Warm-up</h3>
      <p>1. Walk me through a recent project where you used an AI tool. What did it help with? What did it not?</p>
      <p>2. When you notice an AI output is wrong, what tips you off?</p>
      <h3 style={{ fontSize: 16, fontFamily: RA.serif, fontWeight: 500 }}>Calibration</h3>
      <p>3. Describe a time you trusted an AI output and were wrong. What happened after?</p>
      <p>4. Describe a time you doubted an AI output and it was right. What did you learn?</p>
      <h3 style={{ fontSize: 16, fontFamily: RA.serif, fontWeight: 500 }}>Disclosure</h3>
      <p>5. How do you describe AI assistance in your methods sections? To co-authors? To reviewers?</p>
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, marginTop: 16 }}>+ 7 more · click to expand</div>
    </div>
  );
}

function ConsentPreview() {
  return (
    <div>
      <div style={{ padding: 12, background: RA.paper2, border: `1px solid ${RA.line}`, marginBottom: 16, fontSize: 12, color: RA.ink2, fontFamily: RA.mono }}>
        🔒 IRB approved · #24-0451 · expires 2026-03-01
      </div>
      <div style={{ padding: 32, background: RA.paper, border: `1px solid ${RA.line}`, fontFamily: RA.serif, fontSize: 13, lineHeight: 1.65, color: RA.ink2, maxWidth: 640 }}>
        <div style={{ textAlign: 'center', marginBottom: 20 }}>
          <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, letterSpacing: 0.15 }}>UNIVERSITY IRB</div>
          <div style={{ fontSize: 16, fontWeight: 500, marginTop: 4 }}>Informed Consent for Research Participation</div>
        </div>
        <p><b>Study:</b> Calibrated trust in AI research assistants.</p>
        <p><b>Purpose:</b> This study examines how researchers evaluate the accuracy of AI-generated outputs...</p>
        <p><b>Procedures:</b> You will complete a 15-minute survey and may be invited for a 45-minute follow-up interview...</p>
        <p><b>Risks:</b> Minimal. No identifying information will be published.</p>
        <p style={{ color: RA.ink3, fontSize: 12, marginTop: 20 }}>[… 4 more paragraphs …]</p>
      </div>
    </div>
  );
}

function StimuliPreview() {
  const [tab, setTab] = useState('cards');
  const [selectedStim, setSelectedStim] = useState(0);

  const stim = [
    {
      file: '01_lit_search_accurate.md', task: 'Literature search', condition: 'accurate',
      prompt: 'Summarize recent findings on calibration of expert judgement under uncertainty.',
      output: 'Chen & Alvarez (2023, Psychological Science) found that experts over-estimated their accuracy by 14 percentage points on novel tasks. Calibration improved with immediate feedback but not with delayed feedback. These findings align with earlier work by Kim et al. (2022) on metacognitive accuracy.',
      note: 'All three citations exist and claims match the cited papers.',
    },
    {
      file: '02_lit_search_hallucinated.md', task: 'Literature search', condition: 'hallucinated',
      prompt: 'Summarize recent findings on calibration of expert judgement under uncertainty.',
      output: 'Thompson et al. (2024, Journal of Behavioral Decision Making) showed that calibration training reduced overconfidence by 38%. This replicates Barker and Ostrowski (2021), who used the same protocol in a sample of physicians.',
      note: 'Both citations are fabricated. Thompson et al. (2024) does not exist; Barker and Ostrowski (2021) is a nonexistent paper in a real journal.',
    },
    {
      file: '03_data_clean_correct.md', task: 'Data cleaning', condition: 'correct',
      prompt: 'Here is a CSV with 3,400 survey rows. Remove duplicates and attention-check failures.',
      output: 'Dropped 47 rows where `response_id` was duplicated (keeping the most-complete response). Dropped 122 rows that failed the attention check (`q7 != "agree"`). Final N = 3,231. No rows removed on duration; sensitivity analysis recommended.',
      note: 'Decisions match pre-registered cleaning rules exactly.',
    },
    {
      file: '04_data_clean_wrong_dedup.md', task: 'Data cleaning', condition: 'subtle error',
      prompt: 'Here is a CSV with 3,400 survey rows. Remove duplicates and attention-check failures.',
      output: 'Dropped 104 rows where `email` was duplicated (keeping the first response). Dropped 122 rows that failed the attention check. Final N = 3,174.',
      note: 'Subtle error: deduplicates on `email` rather than `response_id`, dropping legitimate re-consented participants. Easy to miss in review.',
    },
    {
      file: '05_causal_correct.md', task: 'Causal inference', condition: 'correct',
      prompt: 'Does AI-tool usage predict publication count? Analyze the attached panel data.',
      output: 'Observational. A naive OLS shows β = 0.41 (p < .001), but this is confounded by career stage and field. Caution against causal interpretation without an IV or staggered adoption design. Correlation, not causation.',
      note: 'Appropriately flags confounding and refuses a causal claim.',
    },
    {
      file: '06_causal_confounded.md', task: 'Causal inference', condition: 'confounded',
      prompt: 'Does AI-tool usage predict publication count? Analyze the attached panel data.',
      output: 'Regressing publications on AI usage, β = 0.41 (p < .001, 95% CI [0.28, 0.54]). Researchers who use AI tools publish significantly more — a one-unit increase in usage predicts 0.4 additional publications per year.',
      note: 'States a causal relationship from observational data. No mention of confounding, selection, or field differences.',
    },
    {
      file: '07_writing_clear.md', task: 'Writing', condition: 'clear',
      prompt: 'Rewrite this paragraph for a general-audience abstract.',
      output: 'We asked 312 researchers how much they trust AI tools for different tasks. Trust was highest for looking up papers and lowest for drawing causal conclusions. This gap narrows with training, but it does not close.',
      note: 'Concrete, ordered, plain language. Preserves the study\'s central finding.',
    },
    {
      file: '08_writing_vague.md', task: 'Writing', condition: 'vague',
      prompt: 'Rewrite this paragraph for a general-audience abstract.',
      output: 'This study explores perceptions of AI in scientific contexts, leveraging a mixed-methods approach to illuminate multifaceted dimensions of trust and calibration across diverse research tasks.',
      note: 'Uses abstract nouns ("perceptions", "dimensions"), zero numbers, zero findings. The content of the paper has disappeared.',
    },
  ];

  return (
    <div>
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, marginBottom: 12 }}>
        8 vignettes · 4 tasks × 2 conditions · randomized within-subject
      </div>

      {/* Tab switcher */}
      <div style={{ display: 'flex', gap: 2, marginBottom: 16, borderBottom: `1px solid ${RA.line}` }}>
        {[
          { id: 'cards',   label: 'Vignettes' },
          { id: 'preview', label: 'Participant view' },
          { id: 'matrix',  label: 'Design matrix' },
        ].map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} style={{
            padding: '8px 14px', fontSize: 12, fontFamily: RA.mono,
            background: 'transparent', border: 'none', cursor: 'pointer',
            color: tab === t.id ? RA.ink : RA.ink3,
            borderBottom: tab === t.id ? `2px solid ${RA.accent}` : '2px solid transparent',
            marginBottom: -1, letterSpacing: 0.1, textTransform: 'uppercase',
          }}>{t.label}</button>
        ))}
      </div>

      {tab === 'cards'   && <StimCards stim={stim} />}
      {tab === 'preview' && <StimParticipant stim={stim} idx={selectedStim} setIdx={setSelectedStim} />}
      {tab === 'matrix'  && <StimMatrix stim={stim} />}
    </div>
  );
}

function StimCards({ stim }) {
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
      {stim.map((s, i) => {
        const good = ['accurate', 'correct', 'clear'].includes(s.condition);
        const color = good ? '#4a5a42' : RA.accentDeep;
        const bg = good ? '#e8ebe5' : RA.accentSoft;
        return (
          <div key={i} style={{
            border: `1px solid ${RA.line}`, borderLeft: `3px solid ${good ? '#8aa378' : RA.accent}`,
            borderRadius: 3, padding: '12px 14px', background: RA.paper,
          }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, gap: 8 }}>
              <div style={{ fontFamily: RA.mono, fontSize: 10.5, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1 }}>
                {String(i + 1).padStart(2, '0')} · {s.task}
              </div>
              <span style={{ fontSize: 10, padding: '2px 8px', borderRadius: 999, background: bg, color, fontFamily: RA.mono, whiteSpace: 'nowrap' }}>
                {s.condition}
              </span>
            </div>

            <div style={{ fontFamily: RA.mono, fontSize: 9.5, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, marginBottom: 4 }}>
              prompt
            </div>
            <div style={{ fontFamily: RA.serif, fontSize: 12.5, color: RA.ink2, fontStyle: 'italic', lineHeight: 1.5, marginBottom: 10 }}>
              {s.prompt}
            </div>

            <div style={{ fontFamily: RA.mono, fontSize: 9.5, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, marginBottom: 4 }}>
              AI output
            </div>
            <div style={{ fontFamily: RA.serif, fontSize: 13, color: RA.ink, lineHeight: 1.55, marginBottom: 10 }}>
              {s.output}
            </div>

            <div style={{ paddingTop: 8, borderTop: `1px dashed ${RA.line}`, fontFamily: RA.serif, fontSize: 12, color: RA.ink3, fontStyle: 'italic', lineHeight: 1.5 }}>
              <span style={{ fontFamily: RA.mono, fontStyle: 'normal', color: RA.accent, textTransform: 'uppercase', letterSpacing: 0.1, fontSize: 9.5, marginRight: 6 }}>
                design
              </span>
              {s.note}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function StimParticipant({ stim, idx, setIdx }) {
  const s = stim[idx];
  return (
    <div>
      {/* Navigation */}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
        <button onClick={() => setIdx((idx - 1 + stim.length) % stim.length)} style={miniBtn()}>← prev</button>
        <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3 }}>
          Vignette {idx + 1} of {stim.length} · <span style={{ color: RA.accent }}>{s.task} · {s.condition}</span>
        </div>
        <button onClick={() => setIdx((idx + 1) % stim.length)} style={miniBtn()}>next →</button>
      </div>

      {/* Qualtrics-style frame */}
      <div style={{
        border: `1px solid ${RA.line}`, background: '#fff', borderRadius: 3,
        boxShadow: '0 1px 0 rgba(0,0,0,0.03)', overflow: 'hidden',
      }}>
        <div style={{ padding: '10px 18px', background: '#f8f7f2', borderBottom: `1px solid ${RA.line}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <span style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, letterSpacing: 0.1, textTransform: 'uppercase' }}>
            Qualtrics · page {idx + 3} of 12 · progress: {Math.round(((idx + 3) / 12) * 100)}%
          </span>
          <span style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3 }}>trust-ai-study · v1.4</span>
        </div>

        <div style={{ padding: '28px 36px' }}>
          <div style={{ fontFamily: RA.sans, fontSize: 14, color: RA.ink, marginBottom: 18, lineHeight: 1.55 }}>
            Imagine you are a researcher. You asked an AI assistant the following:
          </div>

          <div style={{ padding: 14, background: '#f8f7f2', borderLeft: `3px solid ${RA.ink3}`, marginBottom: 20 }}>
            <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, marginBottom: 6, textTransform: 'uppercase', letterSpacing: 0.1 }}>Your prompt</div>
            <div style={{ fontFamily: RA.serif, fontSize: 14, fontStyle: 'italic', color: RA.ink2, lineHeight: 1.5 }}>"{s.prompt}"</div>
          </div>

          <div style={{ padding: 16, background: '#fdfcf8', border: `1px solid ${RA.line}`, marginBottom: 24 }}>
            <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.1 }}>AI response</div>
            <div style={{ fontFamily: RA.serif, fontSize: 14, color: RA.ink, lineHeight: 1.6 }}>{s.output}</div>
          </div>

          <div style={{ fontFamily: RA.sans, fontSize: 14, color: RA.ink, marginBottom: 12 }}>
            <b>Q{idx + 1}.</b> How much would you trust this response?
          </div>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8, maxWidth: 480 }}>
            <span style={{ fontSize: 11, color: RA.ink3, fontFamily: RA.sans }}>Not at all</span>
            {[1,2,3,4,5].map(n => (
              <label key={n} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, cursor: 'pointer' }}>
                <span style={{ width: 22, height: 22, borderRadius: '50%', border: `1.5px solid ${RA.ink3}`, background: 'white' }} />
                <span style={{ fontSize: 11, color: RA.ink3, fontFamily: RA.mono }}>{n}</span>
              </label>
            ))}
            <span style={{ fontSize: 11, color: RA.ink3, fontFamily: RA.sans }}>Completely</span>
          </div>

          <div style={{ marginTop: 20, fontFamily: RA.sans, fontSize: 14, color: RA.ink, marginBottom: 8 }}>
            <b>Q{idx + 1}b.</b> What, if anything, would you verify before using this?
          </div>
          <div style={{ height: 56, border: `1px solid ${RA.line}`, background: 'white', borderRadius: 2 }} />
        </div>
      </div>

      <div style={{ marginTop: 14, padding: 12, background: RA.paper2, fontSize: 12, color: RA.ink3, fontStyle: 'italic', fontFamily: RA.serif, lineHeight: 1.5, borderRadius: 3 }}>
        <span style={{ fontFamily: RA.mono, fontStyle: 'normal', color: RA.accent, marginRight: 6 }}>note to reviewer:</span>
        {s.note}
      </div>
    </div>
  );
}

function StimMatrix({ stim }) {
  const tasks = ['Literature search', 'Data cleaning', 'Causal inference', 'Writing'];
  const cond = ['good', 'bad'];
  const goodLabels = { 'Literature search': 'accurate', 'Data cleaning': 'correct', 'Causal inference': 'correct', 'Writing': 'clear' };

  const cellFor = (task, kind) => {
    const target = kind === 'good' ? goodLabels[task] : null;
    return stim.find(s => s.task === task && (kind === 'good' ? s.condition === target : s.condition !== goodLabels[task]));
  };

  return (
    <div>
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, marginBottom: 14, fontStyle: 'italic' }}>
        Fully crossed 4 × 2 design. Within-subject; order randomized.
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '160px 1fr 1fr', gap: 1, background: RA.line, border: `1px solid ${RA.line}` }}>
        <div style={{ background: RA.paper2, padding: '12px 14px', fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1 }}>
          task \ condition
        </div>
        <div style={{ background: '#e8ebe5', padding: '12px 14px', fontFamily: RA.mono, fontSize: 10, color: '#4a5a42', textTransform: 'uppercase', letterSpacing: 0.1, textAlign: 'center' }}>
          well-formed
        </div>
        <div style={{ background: RA.accentSoft, padding: '12px 14px', fontFamily: RA.mono, fontSize: 10, color: RA.accentDeep, textTransform: 'uppercase', letterSpacing: 0.1, textAlign: 'center' }}>
          seeded flaw
        </div>

        {tasks.map(task => (
          <React.Fragment key={task}>
            <div style={{ background: RA.paper, padding: '14px', fontFamily: RA.serif, fontSize: 14, color: RA.ink }}>
              {task}
            </div>
            {cond.map(k => {
              const cell = cellFor(task, k);
              return (
                <div key={k} style={{ background: RA.paper, padding: 14, minHeight: 100 }}>
                  <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.accent, marginBottom: 6 }}>
                    {cell.condition}
                  </div>
                  <div style={{ fontFamily: RA.serif, fontSize: 12.5, color: RA.ink2, lineHeight: 1.5 }}>
                    {cell.output.length > 180 ? cell.output.slice(0, 175) + '…' : cell.output}
                  </div>
                </div>
              );
            })}
          </React.Fragment>
        ))}
      </div>
    </div>
  );
}

function AnalysisPreview() {
  const audits = [
    {
      id: 'h1', label: 'H1 · Trust calibration varies by task type.',
      status: 'planned',
      prereg: 'One-way ANOVA on trust ~ task. Hypothesize M_search > 4 and M_causal < 3.',
      executed: 'F(4, 307) = 24.3, p < .001. M_search = 4.2, M_causal = 2.1. Both predictions supported.',
    },
    {
      id: 'h2', label: 'H2 · Disclosure predicts calibration.',
      status: 'deviated',
      prereg: 'Correlation between disclosure and accuracy × confidence; hypothesize r > .3.',
      executed: 'r = .22, p = .03. Below the pre-registered threshold.',
      note: 'Reported in §3 as "partial support." Drafted paragraph added to §4.3 Limitations.',
    },
    {
      id: 'exc', label: 'Exclusion rules',
      status: 'deviated',
      prereg: '(1) Fail attention check. (2) Duration < 120s. (3) Completion ≥ 45 min.',
      executed: 'Rules (1) and (3) applied; rule (2) dropped.',
      note: 'Duration rule removed at R&R per reviewer request ("excludes legitimate fast responders"). Sensitivity analysis with rule (2) applied reported in Appendix C.',
    },
    {
      id: 'mod', label: 'Moderation by PhD training',
      status: 'exploratory',
      prereg: 'Not pre-registered.',
      executed: 'β = −0.18, SE = 0.06, p < .01. Added during revision at editor\'s request.',
      note: 'Labeled exploratory throughout §3 and §4 per best practice.',
    },
  ];

  const counts = {
    planned: audits.filter(a => a.status === 'planned').length,
    deviated: audits.filter(a => a.status === 'deviated').length,
    exploratory: audits.filter(a => a.status === 'exploratory').length,
  };

  return (
    <div style={{ maxWidth: 760 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 18 }}>
        <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.accent }}>🔒 pre-registered v1.0 · locked 2025-03-01</div>
        <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, letterSpacing: 0.1, textTransform: 'uppercase' }}>prereg → execution audit</div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 8, marginBottom: 22 }}>
        <AuditSummary n={counts.planned} label="executed as planned" color={RA.accent} />
        <AuditSummary n={counts.deviated} label="deviations from plan" color="#c86a4f" />
        <AuditSummary n={counts.exploratory} label="exploratory (not pre-reg)" color={RA.ink3} />
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {audits.map(a => <AuditRow key={a.id} {...a} />)}
      </div>

      <div style={{ marginTop: 20, padding: 14, background: RA.paper2, border: `1px solid ${RA.line}`, borderRadius: 3, fontSize: 13, color: RA.ink2, lineHeight: 1.6 }}>
        <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, letterSpacing: 0.1, textTransform: 'uppercase', marginBottom: 6 }}>
          auto-drafted
        </div>
        Deviation paragraph drafted from this audit for the <span style={{ color: RA.accent, textDecoration: 'underline', textDecorationStyle: 'dotted' }}>Limitations section (§4.3) ↗</span>
      </div>
    </div>
  );
}

function AuditSummary({ n, label, color }) {
  return (
    <div style={{ padding: '10px 12px', border: `1px solid ${RA.line}`, borderRadius: 3, background: RA.paper }}>
      <div style={{ fontFamily: RA.serif, fontSize: 28, color, lineHeight: 1 }}>{n}</div>
      <div style={{ fontSize: 11, color: RA.ink3, fontFamily: RA.mono, marginTop: 4, lineHeight: 1.35 }}>{label}</div>
    </div>
  );
}

function AuditRow({ label, status, prereg, executed, note }) {
  const meta = {
    planned:     { icon: '✓', color: RA.accent, text: 'as planned' },
    deviated:    { icon: '⚠', color: '#c86a4f', text: 'deviation' },
    exploratory: { icon: '+', color: RA.ink3,   text: 'exploratory' },
    skipped:     { icon: '✗', color: '#c86a4f', text: 'skipped' },
  }[status];

  return (
    <div style={{ border: `1px solid ${RA.line}`, borderLeft: `3px solid ${meta.color}`, borderRadius: 3, padding: 14, background: RA.paper }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 10, gap: 10, flexWrap: 'wrap' }}>
        <div style={{ fontFamily: RA.serif, fontSize: 15, color: RA.ink }}>{label}</div>
        <span style={{ fontFamily: RA.mono, fontSize: 10, textTransform: 'uppercase', letterSpacing: 0.1, color: meta.color, padding: '2px 8px', border: `1px solid ${meta.color}`, borderRadius: 999, whiteSpace: 'nowrap' }}>
          {meta.icon} {meta.text}
        </span>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: '72px 1fr', gap: '6px 14px', fontSize: 13, lineHeight: 1.5 }}>
        <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, paddingTop: 2 }}>pre-reg</div>
        <div style={{ color: RA.ink2 }}>{prereg}</div>
        <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, paddingTop: 2 }}>executed</div>
        <div style={{ color: RA.ink }}>{executed}</div>
        {note && (<>
          <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, paddingTop: 2 }}>note</div>
          <div style={{ color: RA.ink3, fontFamily: RA.serif, fontStyle: 'italic' }}>{note}</div>
        </>)}
      </div>
    </div>
  );
}

function miniBtn(accent) {
  return {
    padding: '6px 12px', fontFamily: RA.sans, fontSize: 12, fontWeight: 500,
    background: accent ? RA.accent : 'transparent',
    color: accent ? RA.paper : RA.ink2,
    border: `1px solid ${accent ? RA.accent : RA.line}`,
    borderRadius: 4, cursor: 'pointer',
  };
}

ReactDOM.createRoot(document.getElementById('root')).render(<MaterialsScreen />);
</script>
</body>
</html>
