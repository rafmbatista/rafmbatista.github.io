<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Library — Manuscript</title>
<link rel="stylesheet" href="../shared/tokens.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="../shared/shared-components.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

// ── DATA ─────────────────────────────────────────────────────────────
const CLUSTERS = [
  { id: 'c1', label: 'calibration & metacognition', x: 180, y: 140, r: 90, color: RA.accent,  n: 12 },
  { id: 'c2', label: 'AI usage in science',         x: 420, y: 190, r: 110, color: RA.quant,  n: 18 },
  { id: 'c3', label: 'hallucination & verification', x: 260, y: 340, r: 80, color: RA.qual,   n: 11 },
  { id: 'c4', label: 'research workflow',           x: 500, y: 400, r: 60, color: '#6F746A',  n: 6 },
];

const PAPERS = [
  {
    id: 'shah2024', x: 400, y: 170, c: 'c2', label: 'Shah 2024',
    title: 'AI use among researchers: a survey of 2,400 scientists',
    authors: 'Shah, N., Li, M., & Patel, K.', venue: 'Nature Human Behaviour', year: 2024,
    sections: ['§ 1 Introduction', '§ 2 Methods', '§ 4 Discussion'],
    excerpts: [
      { page: 4, text: '72% of respondents reported using at least one AI tool weekly, but only 31% disclosed this in methods sections.' },
      { page: 7, text: 'Trust varied widely by task: high for literature search (M=4.1), low for statistical analysis (M=2.3).' },
      { page: 11, text: 'Researchers who verified AI outputs showed better calibration than those who did not, r=.42.' },
    ],
    citations: [
      { section: '§ 1 Introduction', text: 'Prior work (Shah 2024) has documented usage; few studies examine calibration.' },
      { section: '§ 2 Methods',      text: 'We adapted the trust-by-task instrument from Shah (2024).' },
      { section: '§ 4 Discussion',   text: 'Our findings extend Shah (2024) by showing…' },
    ],
  },
  {
    id: 'okafor2025', x: 460, y: 210, c: 'c2', label: 'Okafor 2025',
    title: 'A field experiment on AI-assisted drafting in research labs',
    authors: 'Okafor, J., & Vasquez, R.', venue: 'PNAS', year: 2025,
    sections: ['§ 1 Introduction', '§ 3 Results'],
    excerpts: [
      { page: 2, text: 'Treatment labs produced drafts 38% faster but caught 22% fewer errors at first review.' },
      { page: 9, text: 'Effects attenuated when teams added a verification checkpoint before submission.' },
    ],
    citations: [
      { section: '§ 1 Introduction', text: 'Recent field work (Okafor & Vasquez, 2025) suggests tradeoffs…' },
      { section: '§ 3 Results',      text: 'Consistent with Okafor & Vasquez (2025), we observe a speed-accuracy tension.' },
    ],
  },
  {
    id: 'chen2023', x: 180, y: 120, c: 'c1', label: 'Chen 2023',
    title: 'Calibration of expert judgement under uncertainty',
    authors: 'Chen, Y., & Alvarez, D.', venue: 'Psychological Science', year: 2023,
    sections: ['§ 2 Methods', '§ 3 Results'],
    excerpts: [
      { page: 3, text: 'Experts over-estimated their accuracy by 14 percentage points on novel tasks.' },
      { page: 6, text: 'Calibration improved with immediate feedback but not with delayed feedback.' },
    ],
    citations: [
      { section: '§ 2 Methods',  text: 'We follow the calibration protocol of Chen & Alvarez (2023).' },
      { section: '§ 3 Results',  text: 'Miscalibration patterns mirror those reported by Chen & Alvarez (2023).' },
    ],
  },
  {
    id: 'kim2022', x: 230, y: 160, c: 'c1', label: 'Kim 2022',
    title: 'Metacognitive accuracy in scientific self-assessment',
    authors: 'Kim, S., Ito, H., & Fernández, P.', venue: 'Cognition', year: 2022,
    sections: ['§ 2 Methods'],
    excerpts: [
      { page: 8, text: 'Self-rated confidence correlated only weakly with actual performance (r=.19).' },
    ],
    citations: [
      { section: '§ 2 Methods', text: 'Our confidence items are adapted from Kim et al. (2022).' },
    ],
  },
  {
    id: 'rao2024', x: 150, y: 170, c: 'c1', label: 'Rao 2024',
    title: 'Reviewer confidence and the value of peer review',
    authors: 'Rao, A., & Whitman, G.', venue: 'Research Policy', year: 2024,
    sections: ['§ 3 Results', '§ 4 Discussion'],
    excerpts: [
      { page: 5, text: 'Reviewers expressing high confidence were no more likely to identify methodological errors.' },
      { page: 12, text: 'Structured checklists closed roughly half of the confidence-accuracy gap.' },
    ],
    citations: [
      { section: '§ 3 Results',    text: 'Our calibration gap is roughly half the size reported by Rao & Whitman (2024).' },
      { section: '§ 4 Discussion', text: 'As Rao & Whitman (2024) argue, structured prompts may help…' },
    ],
  },
  {
    id: 'liu2025', x: 260, y: 330, c: 'c3', label: 'Liu 2025',
    title: 'Rates and kinds of hallucination in scientific claims generated by LLMs',
    authors: 'Liu, W., Bhattacharya, T., & Pereira, M.', venue: 'Nature', year: 2025,
    sections: ['§ 3 Results', '§ 4 Discussion'],
    excerpts: [
      { page: 2, text: 'Across 4,200 generated claims, 6.8% contained fabricated citations.' },
      { page: 10, text: 'Hallucinations clustered in topics with sparse training data.' },
    ],
    citations: [
      { section: '§ 3 Results',    text: 'Our observed fabrication rate (7.1%) is consistent with Liu et al. (2025).' },
      { section: '§ 4 Discussion', text: 'Liu et al. (2025) motivate our verification step.' },
    ],
  },
  {
    id: 'park2024', x: 290, y: 370, c: 'c3', label: 'Park 2024',
    title: 'Verification behaviors in AI-augmented research',
    authors: 'Park, H., & Dunne, E.', venue: 'CHI', year: 2024,
    sections: ['§ 4 Discussion'],
    excerpts: [
      { page: 7, text: 'Researchers who "always verified" were a minority (23%); most spot-checked.' },
    ],
    citations: [
      { section: '§ 4 Discussion', text: 'Park & Dunne (2024) describe a similar verification gap.' },
    ],
  },
  {
    id: 'garcia2023', x: 520, y: 410, c: 'c4', label: 'Garcia 2023',
    title: 'Writing workflows under AI assistance: a diary study',
    authors: 'Garcia, M., & Nwosu, C.', venue: 'CSCW', year: 2023,
    sections: ['§ 1 Introduction'],
    excerpts: [
      { page: 3, text: 'Participants oscillated between "draft alone" and "revise with AI" phases within a single session.' },
    ],
    citations: [
      { section: '§ 1 Introduction', text: 'Diary studies (Garcia & Nwosu, 2023) document distinct usage phases.' },
    ],
  },
  {
    id: 'ng2024', x: 380, y: 280, c: 'c2', label: 'Ng 2024',
    title: 'AI adoption across graduate research labs',
    authors: 'Ng, T., Oduya, C., & Rosen, L.', venue: 'Science', year: 2024,
    sections: ['§ 1 Introduction', '§ 2 Methods'],
    excerpts: [
      { page: 4, text: 'Adoption was nearly universal (94%) but guidelines existed in only 11% of labs.' },
      { page: 6, text: 'Junior researchers reported higher usage and higher uncertainty about acceptable practice.' },
    ],
    citations: [
      { section: '§ 1 Introduction', text: 'Adoption is near-ceiling (Ng et al., 2024), but norms lag.' },
      { section: '§ 2 Methods',      text: 'Our sampling frame draws on Ng et al. (2024).' },
    ],
  },
  {
    id: 'weller2024', x: 470, y: 150, c: 'c2', label: 'Weller 2024',
    title: 'Automated literature review: promise and pitfalls',
    authors: 'Weller, A., & Khoury, J.', venue: 'JAMA', year: 2024,
    sections: ['§ 1 Introduction'],
    excerpts: [
      { page: 5, text: 'Automated reviews achieved 82% recall against expert-curated sets but missed high-quality recent work.' },
    ],
    citations: [
      { section: '§ 1 Introduction', text: 'Automated reviewers (Weller & Khoury, 2024) complement, not replace, reading.' },
    ],
  },
];

const SECTION_ORDER = ['§ 1 Introduction', '§ 2 Methods', '§ 3 Results', '§ 4 Discussion'];

// ── SCREEN ───────────────────────────────────────────────────────────
function LibraryScreen() {
  const [selected, setSelected] = useState('shah2024');
  const [view, setView] = useState('clusters');
  const [rightTab, setRightTab] = useState('detail');

  return (
    <>
      <ScreenBar current="papers" label="Library" />
      <ConceptNote>The reference list is a knowledge graph. Every citation traces back to a sentence you've actually read.</ConceptNote>

      <ScreenIntro
        kicker="Screen 05 · Library"
        title={<>References as a <em style={{ fontStyle: 'italic' }}>knowledge graph.</em></>}
        caption="47 papers, clustered by theme. Every citation traces to an excerpt you actually read. No BibTeX, no ghost citations."
      />

      <MockFrame title="claude-ra · library · 47 papers" height={740}>
        <ProjectRail active="papers" />
        <LibraryBody selected={selected} setSelected={setSelected} view={view} setView={setView} rightTab={rightTab} setRightTab={setRightTab} />
      </MockFrame>

      <div className="container" style={{ padding: '32px 24px 0' }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 24, borderTop: `1px solid ${RA.line}`, paddingTop: 24 }}>
          <LN num="A"><b>Clusters, not lists.</b> Papers group by theme automatically. You see where your lit review has gaps.</LN>
          <LN num="B"><b>Excerpts are sources.</b> Every citation traces to a highlighted passage — the sentence you actually read.</LN>
          <LN num="C"><b>Ghost-citation guard.</b> If Claude suggests a paper, it lives here first. You read it before it ever enters the manuscript.</LN>
        </div>
      </div>

      <ScreenFooter prev="materials" next={null} />
    </>
  );
}

function LN({ num, children }) {
  return (
    <div style={{ display: 'flex', gap: 14 }}>
      <span style={{ width: 26, height: 26, borderRadius: '50%', background: RA.paper2, border: `1px solid ${RA.line}`, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', fontFamily: RA.serif, fontSize: 15, color: RA.accent, flexShrink: 0 }}>{num}</span>
      <div style={{ fontSize: 14, color: RA.ink2, lineHeight: 1.55 }}>{children}</div>
    </div>
  );
}

function LibraryBody({ selected, setSelected, view, setView, rightTab, setRightTab }) {
  const trace = rightTab === 'trace';
  return (
    <div style={{ flex: 1, display: 'grid', gridTemplateColumns: '1fr 380px', overflow: 'hidden' }}>
      <LeftPane selected={selected} setSelected={setSelected} view={view} setView={setView} trace={trace} />
      <RightPanel selected={selected} rightTab={rightTab} setRightTab={setRightTab} />
    </div>
  );
}

// ── LEFT PANE (switches by view) ─────────────────────────────────────
function LeftPane({ selected, setSelected, view, setView, trace }) {
  return (
    <div style={{ position: 'relative', overflow: 'hidden', background: RA.paper, display: 'flex', flexDirection: 'column' }}>
      {/* toolbar */}
      <div style={{
        padding: '14px', display: 'flex', justifyContent: 'space-between', gap: 8,
        borderBottom: `1px solid ${RA.line}`, background: RA.paper2, flexShrink: 0,
      }}>
        <div style={{ display: 'flex', gap: 8 }}>
          <input placeholder="search 47 papers…" style={{
            padding: '6px 10px', fontSize: 12, fontFamily: RA.sans,
            border: `1px solid ${RA.line}`, borderRadius: 3, background: RA.paper, width: 220,
          }} />
          <select value={view} onChange={e => setView(e.target.value)} style={{
            padding: '6px 10px', fontSize: 12, fontFamily: RA.sans,
            border: `1px solid ${RA.line}`, borderRadius: 3, background: RA.paper,
          }}>
            <option value="clusters">view: clusters</option>
            <option value="chronological">view: by section</option>
            <option value="list">view: list</option>
          </select>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <button style={miniBtn()}>+ import</button>
          <button style={miniBtn()}>from Zotero</button>
          <button style={miniBtn(true)}>export .bib</button>
        </div>
      </div>

      <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
        {view === 'clusters' && <ClustersView selected={selected} setSelected={setSelected} trace={trace} />}
        {view === 'chronological' && <ChronologicalView selected={selected} setSelected={setSelected} />}
        {view === 'list' && <ListView selected={selected} setSelected={setSelected} />}
      </div>
    </div>
  );
}

// ── VIEWS ────────────────────────────────────────────────────────────
// Manuscript sections rendered as anchors along the right edge of the SVG.
// Full section names live in the right panel (TraceView); in-SVG labels are compact.
const SECTION_ANCHORS = [
  { label: '§1', y: 100, id: '§ 1 Introduction' },
  { label: '§2', y: 210, id: '§ 2 Methods' },
  { label: '§3', y: 320, id: '§ 3 Results' },
  { label: '§4', y: 430, id: '§ 4 Discussion' },
];
const ANCHOR_X = 692;

function ClustersView({ selected, setSelected, trace }) {
  const selPaper = PAPERS.find(p => p.id === selected);

  // Co-cited papers share at least one manuscript section with the selected paper
  const coCited = React.useMemo(() => {
    if (!trace || !selPaper) return new Set();
    const ids = new Set();
    for (const p of PAPERS) {
      if (p.id === selPaper.id) continue;
      if (p.sections.some(s => selPaper.sections.includes(s))) ids.add(p.id);
    }
    return ids;
  }, [trace, selected]);

  // Paper opacity logic under trace
  const paperOpacity = (p) => {
    if (!trace) return 1;
    if (p.id === selected) return 1;
    return coCited.has(p.id) ? 0.95 : 0.18;
  };

  // Cluster dimming: clusters with no traced paper fade
  const activeClusters = React.useMemo(() => {
    if (!trace || !selPaper) return new Set(CLUSTERS.map(c => c.id));
    const s = new Set([selPaper.c]);
    for (const id of coCited) {
      const p = PAPERS.find(x => x.id === id);
      if (p) s.add(p.c);
    }
    return s;
  }, [trace, selected, coCited]);

  // Key on selection so trails re-animate each click
  const traceKey = trace ? `trace-${selected}` : 'no-trace';

  return (
    <svg viewBox="0 0 700 520" width="100%" height="100%" style={{ display: 'block' }}>
      <defs>
        <style>{`
          @keyframes traceDraw {
            from { stroke-dashoffset: 240; opacity: 0; }
            40%  { opacity: 1; }
            to   { stroke-dashoffset: 0; opacity: 1; }
          }
          @keyframes traceDot {
            0%   { r: 2; opacity: 0; }
            60%  { r: 3; opacity: 1; }
            100% { r: 2.5; opacity: 0.85; }
          }
          @keyframes tracePulse {
            0%   { r: 6; }
            50%  { r: 12; opacity: 0.0; }
            100% { r: 6; opacity: 0; }
          }
          @keyframes coCitedPulse {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.4); }
            100% { transform: scale(1); }
          }
          .trace-trail {
            stroke-dasharray: 240;
            animation: traceDraw 650ms cubic-bezier(.6,.2,.3,1) forwards;
          }
          .trace-endcap {
            animation: traceDot 700ms ease-out forwards;
          }
          .trace-halo {
            animation: tracePulse 1100ms ease-out forwards;
          }
          .co-cited {
            transform-origin: center;
            transform-box: fill-box;
            animation: coCitedPulse 520ms ease-out;
          }
        `}</style>
      </defs>

      {/* section anchors on right edge — only visible in trace mode */}
      {trace && (
        <g>
          <line x1={ANCHOR_X} y1={70} x2={ANCHOR_X} y2={460} stroke={RA.line} strokeWidth="1" />
          <text x={ANCHOR_X - 6} y={54} fontSize="9.5" fill={RA.ink3} fontFamily={RA.mono} textAnchor="end" style={{ textTransform: 'uppercase', letterSpacing: 0.5 }}>
            ← manuscript →
          </text>
          {SECTION_ANCHORS.map(a => {
            const isCitedHere = selPaper && selPaper.sections.includes(a.id);
            return (
              <g key={a.id}>
                <circle cx={ANCHOR_X} cy={a.y} r={isCitedHere ? 5 : 3.5} fill={isCitedHere ? RA.accent : RA.paper} stroke={isCitedHere ? RA.accent : RA.ink3} strokeWidth="1.2" />
                <text x={ANCHOR_X - 8} y={a.y + 4} fontSize="11" fill={isCitedHere ? RA.ink : RA.ink3} fontFamily={RA.mono} fontWeight={isCitedHere ? 600 : 400} textAnchor="end">
                  {a.label}
                </text>
              </g>
            );
          })}
        </g>
      )}

      {/* cluster blobs */}
      {CLUSTERS.map(c => {
        const dim = trace && !activeClusters.has(c.id);
        const highlight = trace && selPaper && c.id === selPaper.c;
        return (
          <g key={c.id} style={{ transition: 'opacity 300ms' }} opacity={dim ? 0.18 : 1}>
            <circle cx={c.x} cy={c.y} r={c.r} fill={c.color} opacity={highlight ? 0.14 : 0.08} />
            <circle cx={c.x} cy={c.y} r={c.r} fill="none" stroke={c.color} strokeOpacity={highlight ? 0.6 : 0.3} strokeDasharray="3 3" strokeWidth={highlight ? 1.2 : 1} />
            <text x={c.x} y={c.y - c.r - 6} fontSize="10.5" fill={c.color} textAnchor="middle" fontFamily={RA.mono} style={{ textTransform: 'uppercase', letterSpacing: 0.5 }} opacity="0.85">
              {c.label} · {c.n}
            </text>
          </g>
        );
      })}

      {/* static co-citation edges — dim when trace is on */}
      <g stroke={RA.ink3} strokeWidth="0.6" opacity={trace ? 0.12 : 0.35} style={{ transition: 'opacity 300ms' }}>
        <line x1="400" y1="170" x2="460" y2="210" />
        <line x1="400" y1="170" x2="380" y2="280" />
        <line x1="400" y1="170" x2="230" y2="160" />
        <line x1="400" y1="170" x2="470" y2="150" />
        <line x1="180" y1="120" x2="230" y2="160" />
        <line x1="230" y1="160" x2="150" y2="170" />
        <line x1="260" y1="330" x2="290" y2="370" />
        <line x1="290" y1="370" x2="380" y2="280" />
        <line x1="460" y1="210" x2="380" y2="280" />
        <line x1="520" y1="410" x2="380" y2="280" />
      </g>

      {/* TRACE TRAILS — drawn lines from selected paper to each cited section */}
      {trace && selPaper && (
        <g key={traceKey}>
          {/* outer halo pulse on the selected paper */}
          <circle
            className="trace-halo"
            cx={selPaper.x} cy={selPaper.y}
            fill="none" stroke={RA.accent} strokeWidth="1.5"
          />
          {selPaper.sections.map((sec, i) => {
            const anchor = SECTION_ANCHORS.find(a => a.id === sec);
            if (!anchor) return null;
            // Curved path using a mid control point for visual separation
            const mx = (selPaper.x + ANCHOR_X) / 2 + 20;
            const my = (selPaper.y + anchor.y) / 2;
            const d = `M ${selPaper.x} ${selPaper.y} Q ${mx} ${my} ${ANCHOR_X} ${anchor.y}`;
            return (
              <g key={sec} style={{ animationDelay: `${i * 90}ms` }}>
                <path
                  className="trace-trail"
                  d={d}
                  stroke={RA.accent}
                  strokeWidth="1.6"
                  fill="none"
                  strokeLinecap="round"
                  style={{ animationDelay: `${i * 90}ms` }}
                />
                <circle
                  className="trace-endcap"
                  cx={ANCHOR_X} cy={anchor.y}
                  fill={RA.accent}
                  style={{ animationDelay: `${i * 90 + 500}ms` }}
                />
              </g>
            );
          })}
        </g>
      )}

      {/* papers */}
      {PAPERS.map(p => {
        const isSel = p.id === selected;
        const cluster = CLUSTERS.find(c => c.id === p.c);
        const isCoCited = trace && coCited.has(p.id);
        const op = paperOpacity(p);
        return (
          <g key={p.id} style={{ cursor: 'pointer', transition: 'opacity 300ms' }} opacity={op} onClick={() => setSelected(p.id)}>
            <circle
              className={isCoCited ? 'co-cited' : ''}
              key={traceKey + '-' + p.id}
              cx={p.x} cy={p.y}
              r={isSel ? 9 : 6}
              fill={isSel ? cluster.color : (isCoCited ? cluster.color : RA.paper)}
              stroke={cluster.color}
              strokeWidth={isSel ? 2 : 1.2}
            />
            <text x={p.x + 12} y={p.y + 4} fontSize={isSel ? 11.5 : 10.5} fill={isSel ? RA.ink : RA.ink2} fontFamily={RA.sans} fontWeight={isSel ? 600 : 400}>
              {p.label}
            </text>
            {isSel && (
              <text x={p.x + 12} y={p.y + 18} fontSize="10" fill={RA.accent} fontFamily={RA.mono}>
                {trace
                  ? `traced to ${selPaper.sections.length} section${selPaper.sections.length === 1 ? '' : 's'} · ${coCited.size} co-cited`
                  : `cited ${p.sections.length}× in manuscript`}
              </text>
            )}
          </g>
        );
      })}

      {/* hint / annotation — context-dependent */}
      {!trace ? (
        <g>
          <line x1="40" y1="470" x2="100" y2="430" stroke={RA.ink3} strokeWidth="0.8" />
          <text x="40" y="490" fontSize="10" fill={RA.ink3} fontFamily={RA.mono} style={{ fontStyle: 'italic' }}>
            gap: no papers bridging
          </text>
          <text x="40" y="502" fontSize="10" fill={RA.ink3} fontFamily={RA.mono} style={{ fontStyle: 'italic' }}>
            calibration ↔ hallucination
          </text>
        </g>
      ) : (
        <g>
          <text x="40" y="490" fontSize="10" fill={RA.ink3} fontFamily={RA.mono} style={{ fontStyle: 'italic' }}>
            trace on — click any paper to see where it's
          </text>
          <text x="40" y="502" fontSize="10" fill={RA.ink3} fontFamily={RA.mono} style={{ fontStyle: 'italic' }}>
            cited and which papers share its sections
          </text>
        </g>
      )}
    </svg>
  );
}

function ChronologicalView({ selected, setSelected }) {
  // Group papers by section. A paper can appear in multiple sections.
  const bySection = SECTION_ORDER.map(s => ({
    section: s,
    papers: PAPERS.filter(p => p.sections.includes(s)),
  }));

  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'auto', padding: '20px 24px' }}>
      <div style={{ fontSize: 12, color: RA.ink3, fontFamily: RA.mono, letterSpacing: 0.1, textTransform: 'uppercase', marginBottom: 16 }}>
        Papers cited, by manuscript section
      </div>
      {bySection.map(group => (
        <div key={group.section} style={{ marginBottom: 22, paddingBottom: 18, borderBottom: `1px solid ${RA.lineSoft}` }}>
          <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 10 }}>
            <div style={{ fontFamily: RA.serif, fontSize: 17, color: RA.ink }}>{group.section}</div>
            <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3 }}>{group.papers.length} papers</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {group.papers.map(p => {
              const isSel = p.id === selected;
              const cluster = CLUSTERS.find(c => c.id === p.c);
              return (
                <button key={p.id + group.section} onClick={() => setSelected(p.id)} style={{
                  display: 'flex', alignItems: 'center', gap: 10, textAlign: 'left',
                  padding: '8px 10px', borderRadius: 4,
                  background: isSel ? RA.paper2 : 'transparent',
                  border: `1px solid ${isSel ? cluster.color : 'transparent'}`,
                  cursor: 'pointer', fontFamily: RA.sans,
                }}>
                  <span style={{ width: 8, height: 8, borderRadius: '50%', background: cluster.color, flexShrink: 0 }} />
                  <span style={{ fontSize: 13, color: RA.ink, fontWeight: isSel ? 600 : 400, minWidth: 120 }}>{p.label}</span>
                  <span style={{ fontSize: 12, color: RA.ink2, fontFamily: RA.serif, fontStyle: 'italic', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{p.title}</span>
                  <span style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3 }}>cited {p.sections.length}×</span>
                </button>
              );
            })}
          </div>
        </div>
      ))}
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, textAlign: 'center', padding: '4px 0 8px' }}>
        10 of 47 shown · 37 uncited references in library
      </div>
    </div>
  );
}

function ListView({ selected, setSelected }) {
  const sorted = [...PAPERS].sort((a, b) => a.authors.localeCompare(b.authors));
  return (
    <div style={{ position: 'absolute', inset: 0, overflow: 'auto', padding: '20px 24px' }}>
      <div style={{ fontSize: 12, color: RA.ink3, fontFamily: RA.mono, letterSpacing: 0.1, textTransform: 'uppercase', marginBottom: 16 }}>
        All papers, alphabetical
      </div>
      <div style={{ display: 'flex', flexDirection: 'column' }}>
        {sorted.map(p => {
          const isSel = p.id === selected;
          const cluster = CLUSTERS.find(c => c.id === p.c);
          return (
            <button key={p.id} onClick={() => setSelected(p.id)} style={{
              display: 'grid', gridTemplateColumns: '14px 1fr auto', gap: 12, alignItems: 'baseline', textAlign: 'left',
              padding: '12px 10px',
              background: isSel ? RA.paper2 : 'transparent',
              borderBottom: `1px solid ${RA.lineSoft}`,
              borderLeft: isSel ? `2px solid ${cluster.color}` : '2px solid transparent',
              cursor: 'pointer', fontFamily: RA.sans,
            }}>
              <span style={{ width: 8, height: 8, borderRadius: '50%', background: cluster.color, display: 'inline-block', marginTop: 6 }} />
              <div>
                <div style={{ fontSize: 13, color: RA.ink, fontWeight: isSel ? 600 : 500, marginBottom: 2 }}>
                  {p.authors} ({p.year})
                </div>
                <div style={{ fontFamily: RA.serif, fontSize: 14, color: RA.ink2, lineHeight: 1.35, marginBottom: 2 }}>
                  {p.title}
                </div>
                <div style={{ fontFamily: RA.serif, fontStyle: 'italic', fontSize: 12, color: RA.ink3 }}>
                  {p.venue}
                </div>
              </div>
              <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textAlign: 'right' }}>
                cited {p.sections.length}×
              </div>
            </button>
          );
        })}
      </div>
      <div style={{ fontFamily: RA.mono, fontSize: 11, color: RA.ink3, textAlign: 'center', padding: '12px 0 8px' }}>
        10 of 47 shown · 37 uncited references in library
      </div>
    </div>
  );
}

// ── RIGHT PANEL (tabbed: Paper Detail | Trace) ───────────────────────
function RightPanel({ selected, rightTab, setRightTab }) {
  return (
    <div style={{ borderLeft: `1px solid ${RA.line}`, overflow: 'hidden', background: RA.paper2, display: 'flex', flexDirection: 'column' }}>
      {/* tabs */}
      <div style={{ display: 'flex', borderBottom: `1px solid ${RA.line}`, background: RA.paper2, flexShrink: 0 }}>
        {[
          { id: 'detail', label: 'Paper detail' },
          { id: 'trace',  label: 'Trace' },
        ].map(t => {
          const active = rightTab === t.id;
          return (
            <button
              key={t.id}
              onClick={() => setRightTab(t.id)}
              style={{
                flex: 1,
                padding: '12px 16px',
                fontFamily: RA.mono, fontSize: 10.5,
                letterSpacing: 0.1, textTransform: 'uppercase',
                background: active ? RA.paper2 : 'transparent',
                color: active ? RA.accentDeep : RA.ink3,
                border: 'none',
                borderBottom: `2px solid ${active ? RA.accent : 'transparent'}`,
                cursor: 'pointer',
              }}
            >
              {t.label}
            </button>
          );
        })}
      </div>

      <div style={{ flex: 1, overflow: 'auto' }}>
        {rightTab === 'detail' && <PaperDetail selected={selected} />}
        {rightTab === 'trace'  && <TraceView selected={selected} />}
      </div>
    </div>
  );
}

// ── TRACE VIEW (manuscript outline in right panel) ───────────────────
function TraceView({ selected }) {
  const p = PAPERS.find(x => x.id === selected) || PAPERS[0];
  const citedSet = new Set(p.sections);
  const citationsBySection = {};
  for (const c of p.citations) citationsBySection[c.section] = c.text;

  return (
    <div style={{ padding: 22 }}>
      <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, marginBottom: 10 }}>
        Manuscript outline
      </div>
      <div style={{ fontFamily: RA.serif, fontSize: 14, color: RA.ink2, lineHeight: 1.5, marginBottom: 18 }}>
        <em>{p.label}</em> appears in <b>{p.sections.length}</b> of 4 sections.
      </div>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
        {SECTION_ORDER.map(sec => {
          const isCited = citedSet.has(sec);
          return (
            <div key={sec} style={{
              padding: 12,
              background: isCited ? RA.paper : 'transparent',
              border: `1px solid ${isCited ? RA.accent : RA.lineSoft}`,
              borderLeft: `3px solid ${isCited ? RA.accent : RA.lineSoft}`,
              borderRadius: 3,
              opacity: isCited ? 1 : 0.55,
            }}>
              <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: isCited ? 8 : 0 }}>
                <div style={{ fontFamily: RA.serif, fontSize: 14, color: RA.ink, fontWeight: isCited ? 600 : 400 }}>{sec}</div>
                <div style={{ fontFamily: RA.mono, fontSize: 10, color: isCited ? RA.accent : RA.ink3 }}>
                  {isCited ? 'cited' : 'not cited'}
                </div>
              </div>
              {isCited && (
                <div style={{ fontFamily: RA.serif, fontSize: 12.5, color: RA.ink2, lineHeight: 1.55, fontStyle: 'italic' }}>
                  "{citationsBySection[sec]}"
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{ marginTop: 18, fontFamily: RA.mono, fontSize: 10.5, color: RA.ink3, fontStyle: 'italic', lineHeight: 1.55 }}>
        Co-cited papers (sharing at least one section) are highlighted in the graph.
      </div>
    </div>
  );
}

// ── DETAIL PANEL ─────────────────────────────────────────────────────
function PaperDetail({ selected }) {
  const p = PAPERS.find(x => x.id === selected) || PAPERS[0];
  const cluster = CLUSTERS.find(c => c.id === p.c);

  return (
    <div style={{ padding: 22 }}>
      <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, textTransform: 'uppercase', letterSpacing: 0.1, marginBottom: 10 }}>
        Paper detail
      </div>

      <div style={{ fontFamily: RA.serif, fontSize: 17, lineHeight: 1.3, marginBottom: 8, color: RA.ink }}>
        {p.title}
      </div>
      <div style={{ fontSize: 12, color: RA.ink2, marginBottom: 2 }}>{p.authors}</div>
      <div style={{ fontFamily: RA.serif, fontStyle: 'italic', fontSize: 12.5, color: RA.ink2, marginBottom: 14 }}>
        {p.venue}, {p.year}
      </div>

      <div style={{ display: 'flex', gap: 6, marginBottom: 18, flexWrap: 'wrap' }}>
        <span style={chip(cluster.color)}>{cluster.label}</span>
        <span style={chip(RA.accent)}>cited {p.sections.length}× in manuscript</span>
        <span style={chip(RA.ink3)}>read · {p.excerpts.length} excerpts</span>
      </div>

      <div style={{ marginBottom: 20 }}>
        <div style={{ fontFamily: RA.mono, fontSize: 10, textTransform: 'uppercase', letterSpacing: 0.1, color: RA.ink3, marginBottom: 10 }}>
          Your excerpts
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {p.excerpts.map((e, i) => (
            <div key={i} style={{ padding: 12, background: RA.paper, border: `1px solid ${RA.line}`, borderLeft: `3px solid ${RA.accent}`, borderRadius: 3 }}>
              <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.ink3, marginBottom: 5 }}>p. {e.page}</div>
              <div style={{ fontFamily: RA.serif, fontSize: 13, color: RA.ink, lineHeight: 1.5 }}>
                "{e.text}"
              </div>
            </div>
          ))}
        </div>
      </div>

      <div>
        <div style={{ fontFamily: RA.mono, fontSize: 10, textTransform: 'uppercase', letterSpacing: 0.1, color: RA.ink3, marginBottom: 10 }}>
          Cited in your manuscript
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {p.citations.map((c, i) => (
            <div key={i} style={{ padding: '10px 12px', background: RA.paper, border: `1px solid ${RA.line}`, borderRadius: 3, cursor: 'pointer' }}>
              <div style={{ fontFamily: RA.mono, fontSize: 10, color: RA.accent, marginBottom: 4 }}>{c.section} ↗</div>
              <div style={{ fontFamily: RA.serif, fontSize: 13, color: RA.ink2, lineHeight: 1.5 }}>{c.text}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ marginTop: 20, display: 'flex', gap: 8 }}>
        <button style={miniBtn()}>open PDF</button>
        <button style={miniBtn(true)}>cite in §…</button>
      </div>
    </div>
  );
}

function chip(color) {
  return {
    fontSize: 10.5, padding: '3px 8px', borderRadius: 999,
    background: color + '18', color: color, fontFamily: RA.mono,
    letterSpacing: 0.02,
  };
}

function miniBtn(accent) {
  return {
    padding: '6px 12px', fontFamily: RA.sans, fontSize: 12, fontWeight: 500,
    background: accent ? RA.accent : 'transparent',
    color: accent ? RA.paper : RA.ink2,
    border: `1px solid ${accent ? RA.accent : RA.line}`,
    borderRadius: 4, cursor: 'pointer',
  };
}

ReactDOM.createRoot(document.getElementById('root')).render(<LibraryScreen />);
</script>
</body>
</html>
